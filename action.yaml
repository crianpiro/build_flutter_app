name: Build Flutter App
description: Build the Flutter artifact (iOS IPA or Android APK/AAB) for distribution
branding:
  color: blue
  icon: box
inputs:
  platform:
    description: "Which platform to build: 'ios' or 'android'"
    required: false
    default: ios
  working-directory:
    description: The root directory of the flutter app within this repository
    default: ./
  flavor:
    description: The name of the flavor to build
    required: false
  bundle-id:
    description: The bundle identifier of the flavor to bu
    required: false
  use-flutterfire:
    description: Whether this project uses FlutterFire or not
    required: false
    default: "true"
  # ---- iOS signing (required when platform == 'ios') ----
  certificate-base64:
    description: "The Base64 representation of the .p12 certificate"
    required: false
  certificate-password:
    description: "Password for the .p12 certificate."
    required: false
  provisioning-profile-base64:
    description: "Base64 of the provisioning profile (.mobileprovision)"
    required: false
  export-options-plist:
    description: "The export options .plist with your provisioning profile mapped"
    required: false
  keychain-password:
    description: "Password of the runner keychain"
    required: false
  # ---- Android signing (required when platform == 'android') ----
  android-output:
    description: "Android artifact to produce: 'apk', 'aab' or 'both'"
    required: false
    default: apk
  android-keystore-base64:
    description: "The Base64 representation of the release keystore (.jks/.keystore)"
    required: false
  android-keystore-password:
    description: "Password for the keystore (storePassword)"
    required: false
  android-key-password:
    description: "Password for the signing key (keyPassword)"
    required: false
  android-key-alias:
    description: "Alias of the signing key within the keystore"
    required: false

runs:
  using: composite
  steps:
    - name: Validate inputs
      shell: bash
      env:
        IOS_CERT_B64: ${{ inputs.certificate-base64 }}
        IOS_CERT_PWD: ${{ inputs.certificate-password }}
        IOS_PP_B64: ${{ inputs.provisioning-profile-base64 }}
        IOS_EXPORT_PLIST: ${{ inputs.export-options-plist }}
        IOS_KEYCHAIN_PWD: ${{ inputs.keychain-password }}
        ANDROID_KEYSTORE_B64: ${{ inputs.android-keystore-base64 }}
        ANDROID_KEYSTORE_PWD: ${{ inputs.android-keystore-password }}
        ANDROID_KEY_PWD: ${{ inputs.android-key-password }}
        ANDROID_KEY_ALIAS: ${{ inputs.android-key-alias }}
      run: |
        PLATFORM="${{ inputs.platform }}"
        OUTPUT="${{ inputs.android-output }}"

        if [ "$PLATFORM" != "ios" ] && [ "$PLATFORM" != "android" ]; then
          echo "❌ Invalid 'platform' value: '$PLATFORM'. Allowed values: ios, android."
          exit 1
        fi

        missing=()
        if [ "$PLATFORM" = "ios" ]; then
          [ -z "$IOS_CERT_B64" ] && missing+=("certificate-base64")
          [ -z "$IOS_CERT_PWD" ] && missing+=("certificate-password")
          [ -z "$IOS_PP_B64" ] && missing+=("provisioning-profile-base64")
          [ -z "$IOS_EXPORT_PLIST" ] && missing+=("export-options-plist")
          [ -z "$IOS_KEYCHAIN_PWD" ] && missing+=("keychain-password")
        else
          if [ "$OUTPUT" != "apk" ] && [ "$OUTPUT" != "aab" ] && [ "$OUTPUT" != "both" ]; then
            echo "❌ Invalid 'android-output' value: '$OUTPUT'. Allowed values: apk, aab, both."
            exit 1
          fi
          [ -z "$ANDROID_KEYSTORE_B64" ] && missing+=("android-keystore-base64")
          [ -z "$ANDROID_KEYSTORE_PWD" ] && missing+=("android-keystore-password")
          [ -z "$ANDROID_KEY_PWD" ] && missing+=("android-key-password")
          [ -z "$ANDROID_KEY_ALIAS" ] && missing+=("android-key-alias")
        fi

        if [ ${#missing[@]} -gt 0 ]; then
          echo "❌ Missing required inputs for platform '$PLATFORM': ${missing[*]}"
          exit 1
        fi

        echo "✅ Inputs validated for platform '$PLATFORM'"

    - name: Select latest xcode version
      if: ${{ inputs.platform == 'ios' }}
      shell: bash
      run: |
        latest_xcode=$(ls /Applications | grep '^Xcode' | sort -V | tail -n 1)
        sudo xcode-select -s /Applications/$latest_xcode
        echo "[INFO] Xcode version selected: $latest_xcode"

    - name: Set up Java
      if: ${{ inputs.platform == 'android' }}
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "17"

    - name: Install and setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version-file: ${{ inputs.working-directory }}/pubspec.yaml
        cache: true

    - name: Install Dependencies
      shell: bash
      run: flutter pub get
      working-directory: ${{ inputs.working-directory }}

    - name: Activate FlutterFire
      if: ${{ inputs.use-flutterfire }} == 'true'
      shell: bash
      run: dart pub global activate flutterfire_cli
      working-directory: ${{ inputs.working-directory }}

    - name: Set build environment
      shell: bash
      run: |
        USE_FLAVOR=false
        if [ -n "${{ inputs.flavor }}" ]; then
          USE_FLAVOR=true
        fi
        echo "USE_FLAVOR=$USE_FLAVOR" >> $GITHUB_ENV
        echo "FLAVOR=${{ inputs.flavor }}" >> $GITHUB_ENV

    # =========================
    #  iOS build
    # =========================
    - name: Set ExportOptions.plist
      if: ${{ inputs.platform == 'ios' }}
      working-directory: ${{ inputs.working-directory }}
      shell: bash
      run: |
        echo '${{ inputs.export-options-plist }}' > ios/ExportOptions.plist

    - name: Install certificates and provisioning profiles
      if: ${{ inputs.platform == 'ios' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        IOS_BUILD_CERTIFICATE_BASE64: ${{ inputs.certificate-base64 }}
        IOS_BUILD_CERTIFICATE_PASSWORD: ${{ inputs.certificate-password }}
        IOS_MOBILE_PROVISIONING_PROFILE_BASE64: ${{ inputs.provisioning-profile-base64 }}
        IOS_GITHUB_KEYCHAIN_PASSWORD: ${{ inputs.keychain-password }}
      run: |
        # Create variables
        CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
        KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
        PP_PATH=$RUNNER_TEMP/temp.mobileprovision

        # Import certificate and provisioning profile from secrets
        echo -n "$IOS_BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
        echo -n "$IOS_MOBILE_PROVISIONING_PROFILE_BASE64" | base64 --decode -o $PP_PATH

        # Create temporary keychain
        security create-keychain -p "$IOS_GITHUB_KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
        security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
        security unlock-keychain -p "$IOS_GITHUB_KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

        # Import certificate to keychain
        security import $CERTIFICATE_PATH -P ${{ env.IOS_BUILD_CERTIFICATE_PASSWORD }} -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
        security list-keychain -d user -s $KEYCHAIN_PATH
        security find-identity -v

        # Use UUID for the name of provisioning profile
        UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< $(/usr/bin/security cms -D -i $PP_PATH))

        # Apply provisioning profile
        mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
        cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision

    - name: List provisioning profiles
      if: ${{ inputs.platform == 'ios' }}
      shell: bash
      run: cd ~/Library/MobileDevice/Provisioning\ Profiles && ls

    - name: Build iOS artifact using flavor
      if: ${{ inputs.platform == 'ios' && env.USE_FLAVOR == 'true' }}
      working-directory: ${{ inputs.working-directory }}
      shell: bash
      run: |
        set -o pipefail && flutter build ipa -v --flavor ${{ env.FLAVOR }} --target lib/flavors/main_${{ env.FLAVOR }}.dart --export-options-plist=ios/ExportOptions.plist

    - name: Build iOS artifact without flavor
      if: ${{ inputs.platform == 'ios' && env.USE_FLAVOR == 'false' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -o pipefail && flutter build ipa -v --export-options-plist=ios/ExportOptions.plist

    - name: Checking if IPA export succeeded and rename it
      if: ${{ inputs.platform == 'ios' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        EXPORTED_IPA=$(basename "$(find build/ios/ipa -name "*.ipa" | head -n 1)")
        IPA_PATH="build/ios/ipa/$EXPORTED_IPA"

        if [ -z "$EXPORTED_IPA" ]; then
          echo "❌ IPA export failed: Please see logs above to identify the issue"
          exit 1
        fi

        IPA_NAME=app-release.ipa

        if [ "${{ env.USE_FLAVOR }}" = "true" ]; then
          IPA_NAME=app-${{ env.FLAVOR }}-release.ipa
        fi

        mv "$IPA_PATH" build/ios/ipa/$IPA_NAME

        IPA_PATH="build/ios/ipa/$IPA_NAME"

        echo "✅ IPA export succeeded: $IPA_PATH found"

    # =========================
    #  Android build
    # =========================
    - name: Set up Android signing
      if: ${{ inputs.platform == 'android' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ANDROID_KEYSTORE_BASE64: ${{ inputs.android-keystore-base64 }}
        ANDROID_KEYSTORE_PASSWORD: ${{ inputs.android-keystore-password }}
        ANDROID_KEY_PASSWORD: ${{ inputs.android-key-password }}
        ANDROID_KEY_ALIAS: ${{ inputs.android-key-alias }}
      run: |
        KEYSTORE_PATH="$RUNNER_TEMP/release-keystore.jks"
        echo -n "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"

        # Write key.properties for the Gradle release signingConfig to consume.
        # NOTE: your android/app/build.gradle(.kts) must read android/key.properties
        # and wire it into the release signingConfig (standard Flutter signing setup).
        {
          echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
          echo "keyPassword=$ANDROID_KEY_PASSWORD"
          echo "keyAlias=$ANDROID_KEY_ALIAS"
          echo "storeFile=$KEYSTORE_PATH"
        } > android/key.properties

        echo "[INFO] key.properties written to android/key.properties (storeFile=$KEYSTORE_PATH)"

    - name: Build Android artifact
      if: ${{ inputs.platform == 'android' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        OUTPUT="${{ inputs.android-output }}"
        FLAVOR_ARGS=""
        if [ "${{ env.USE_FLAVOR }}" = "true" ]; then
          FLAVOR_ARGS="--flavor ${{ env.FLAVOR }} --target lib/flavors/main_${{ env.FLAVOR }}.dart"
        fi

        if [ "$OUTPUT" = "apk" ] || [ "$OUTPUT" = "both" ]; then
          echo "[INFO] Building APK..."
          set -o pipefail && flutter build apk -v --release $FLAVOR_ARGS
        fi

        if [ "$OUTPUT" = "aab" ] || [ "$OUTPUT" = "both" ]; then
          echo "[INFO] Building App Bundle (AAB)..."
          set -o pipefail && flutter build appbundle -v --release $FLAVOR_ARGS
        fi

    - name: Checking if Android build succeeded
      if: ${{ inputs.platform == 'android' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        OUTPUT="${{ inputs.android-output }}"

        if [ "$OUTPUT" = "apk" ] || [ "$OUTPUT" = "both" ]; then
          APK_PATH=$(find build/app/outputs/flutter-apk -name "*-release.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "❌ APK build failed: Please see logs above to identify the issue"
            exit 1
          fi
          echo "✅ APK build succeeded: $APK_PATH found"
        fi

        if [ "$OUTPUT" = "aab" ] || [ "$OUTPUT" = "both" ]; then
          AAB_PATH=$(find build/app/outputs/bundle -name "*-release.aab" | head -n 1)
          if [ -z "$AAB_PATH" ]; then
            echo "❌ AAB build failed: Please see logs above to identify the issue"
            exit 1
          fi
          echo "✅ AAB build succeeded: $AAB_PATH found"
        fi
