name: Launch Build Flutter App
on:
  push:
     branches:
      - main

jobs:
  run_build_flutter_app_action:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: example

    steps:

      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Update version
        id: update_version
        run: |
          ruby update_version.rb -t ${{ env.RELEASE_OPTIONS }}

      - name: Run crianpiro/build_flutter_app@v2
        uses: ./
        with:
          platform: ios
          working-directory: example
          certificate-base64: ${{ secrets.P12_BASE64 }}
          certificate-password: ${{ secrets.P12_PASSWORD }}
          provisioning-profile-base64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          keychain-password: ${{ secrets.RUNNER_KEYCHAIN_PASSWORD }}
          export-options-plist: ${{ secrets.EXPORT_OPTIONS }}

  run_build_flutter_app_action_android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: example

    steps:

      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Update version
        id: update_version
        run: |
          ruby update_version.rb -t ${{ env.RELEASE_OPTIONS }}

      - name: Run crianpiro/build_flutter_app@v2
        uses: ./
        with:
          platform: android
          working-directory: example
          android-output: apk
          android-keystore-base64: ${{ secrets.KEYSTORE_BASE64 }}
          android-keystore-password: ${{ secrets.KEYSTORE_PASSWORD }}
          android-key-password: ${{ secrets.KEY_PASSWORD }}
          android-key-alias: ${{ secrets.KEY_ALIAS }}